name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --group dev
      - run: uv run ruff check anishift/ tests/
      - run: uv run ruff format --check anishift/ tests/
      - name: No docstrings/comments in tests
        run: uv run python scripts/hooks/check_test_comments.py $(git ls-files ':(glob)tests/**/*.py' ':(glob)anishift/**/tests/**/*.py' ':(glob)**/conftest.py')
      - name: Docstring under every constant
        run: uv run python scripts/hooks/check_const_docstrings.py $(git ls-files 'anishift/**/*.py')

  audit:
    name: Security (pip-audit) [${{ matrix.os }}]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Export locked project and development dependencies
        run: uv export --frozen --all-groups --no-emit-project --format requirements.txt --output-file audit-requirements.txt
      - name: Audit locked dependencies
        run: uvx pip-audit --requirement audit-requirements.txt --disable-pip --strict

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --group dev
      - run: uv run mypy anishift/ tests/
      # mypy resolves sys.platform for the platform it targets, so a Linux-only run
      # never analyses the Windows branches (config/workspace.py, platform/binaries.py).
      # This mirrors the mypy-linux pre-push hook, which does the same the other way.
      - name: Type check the Windows target
        run: uv run mypy --platform win32 anishift/ tests/

  test:
    name: Test (pytest) [${{ matrix.os }}]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # AniShift ships only to Windows for now: paths, file locks, the console code
        # page, the private torrent client and the Recycle Bin answer only there.
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --group dev
      - name: Entry point smoke
        run: uv run anishift --help
      # Media tests drive the real bundled tools that `anishift setup` downloads and verifies.
      - name: Cache bundled binaries
        uses: actions/cache@v4
        with:
          path: external/bin
          key: external-bin-${{ runner.os }}-${{ hashFiles('external/bin_hashes.json') }}
      - name: Install bundled binaries
        run: uv run anishift setup
      - run: uv run pytest
