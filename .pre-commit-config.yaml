# Pre-commit hooks for AniShift.
# prek installs the hooks, all three stages from default_install_hook_types. Once after `uv sync`:
#   prek install
#
# pre-commit stage: fast, blocks the commit if ruff fails.
# commit-msg stage: enforces Conventional Commits message format and the commit body (summary + Validation).
# pre-push stage: mypy + pytest, so type/test failures surface locally, not in CI.

minimum_pre_commit_version: "4.0.0"
default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

# The code uses Python 3.14 syntax (PEP 758); prek defaults to 3.13 and cannot parse it.
default_language_version:
  python: python3.14

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
        stages: [manual]
      - id: check-useless-excludes
        stages: [manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
        # Two trailing spaces are a hard line break in Markdown.
        args: [--markdown-linebreak-ext=md]
        exclude: ^external/
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: ^external/
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-illegal-windows-names
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: check-ast
        stages: [pre-commit]
      - id: debug-statements
        stages: [pre-commit]
      - id: no-commit-to-branch
        stages: [pre-commit]

  # It rejects `Revert "..."`, which git writes itself. After git revert,
  # rewrite the subject as revert(scope): ... — `revert` is on the type list.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --force-scope
          - --scopes=cli,config,pipeline,platform,setup,services,application,text,tui,extraction,subtitles,translation,tts,llm,audio,composition,utils,logger,agents,deps,infra,release,repo
          - feat
          - fix
          - chore
          - docs
          - refactor
          - test
          - perf
          - style
          - ci
          - build
          - revert

  - repo: https://github.com/MattyMroz/agents
    rev: hooks-v1.3.0 # or newer: prek autoupdate
    hooks:
      # U+FFFD is what a botched encoding leaves behind.
      - id: no-replacement-char
      # Commit body: summary + Validation block bound to recorded runs.
      # Format and the mm-validate workflow: presets/hooks/references/commit-message.md
      - id: commit-validation

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        name: ruff check (auto-fix)
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: no-test-prose
        name: no docstrings/comments in tests
        entry: python scripts/hooks/check_test_comments.py
        language: system
        files: (^tests/|/tests/).*\.(py|ts|tsx|js|jsx)$|(^|/)conftest\.py$
        stages: [pre-commit]
      - id: const-docstrings
        name: docstring under every constant
        entry: python scripts/hooks/check_const_docstrings.py
        language: system
        files: ^anishift/.*\.py$
        stages: [pre-commit]
      - id: no-mutating-assign
        name: no assignment that mutates its own target container
        entry: python scripts/hooks/check_mutating_assign.py
        language: system
        files: \.py$
        stages: [pre-commit]
      - id: mypy
        name: mypy (pre-push)
        entry: uv run mypy anishift/ tests/
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: mypy-linux
        name: mypy (linux target)
        entry: uv run mypy --platform linux anishift/ tests/
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: pytest
        name: pytest (pre-push)
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
